/* ==========================================================================
   Web 学习工具箱 — 样式表
   结构：1 变量  2 基础重置  3 顶栏  4 布局  5 侧边栏  6 详情面板
        7 代码实验区  8 自检结果  9 响应式
   原则：排版优先、动画克制、长阅读不累。
   ========================================================================== */

/* ---------- 1. 主题变量 ---------- */
:root {
  --bg:            #0e1014;
  --bg-elev:       #14171d;
  --bg-elev-2:     #191d24;
  --bg-sunken:     #0a0c10;
  --border:        #23272f;
  --border-soft:   #1b1f26;

  --fg:            #e7e9ee;
  --fg-muted:      #99a1ae;
  --fg-dim:        #6c7480;

  --accent:        #7aa2f7;
  --accent-soft:   rgba(122, 162, 247, .14);
  --accent-line:   rgba(122, 162, 247, .38);

  --c-tag:     #ff9e64;
  --c-attr:    #e0af68;
  --c-css:     #7dcfff;
  --c-js:      #bb9af7;
  --c-concept: #9aa5ce;

  --ok:     #9ece6a;
  --warn:   #e0af68;
  --danger: #f7768e;

  --radius:    10px;
  --radius-sm: 6px;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Cascadia Mono", "Microsoft YaHei", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;

  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
}

html[data-theme="light"] {
  --bg:          #f7f8fa;
  --bg-elev:     #ffffff;
  --bg-elev-2:   #f1f3f7;
  --bg-sunken:   #eceef3;
  --border:      #dde1e8;
  --border-soft: #e8ebf0;

  --fg:          #1c2129;
  --fg-muted:    #5b6371;
  --fg-dim:      #8b93a1;

  --accent:      #2f6fdd;
  --accent-soft: rgba(47, 111, 221, .10);
  --accent-line: rgba(47, 111, 221, .35);

  --c-tag:     #c2571a;
  --c-attr:    #9a6a10;
  --c-css:     #1a6f8f;
  --c-js:      #7c4bbf;
  --c-concept: #5a6684;

  --ok:     #4a7c20;
  --warn:   #9a6a10;
  --danger: #c03a52;

  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
}

/* ---------- 2. 基础重置 ---------- */
*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.7 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;              /* 三栏各自滚动 */
}

h1, h2, h3, h4 { margin: 0; font-weight: 650; line-height: 1.35; }
p { margin: 0 0 .9em; }
ul { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

code, kbd, pre { font-family: var(--mono); font-size: .92em; }

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus { left: 0; }

.muted { color: var(--fg-dim); font-size: 12px; }

/* ---------- 3. 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  height: 56px; padding: 0 16px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
.brand-mark {
  font-family: var(--mono); font-weight: 700; font-size: 15px;
  color: var(--accent); background: var(--accent-soft);
  border: 1px solid var(--accent-line); border-radius: var(--radius-sm);
  padding: 2px 7px; letter-spacing: -.5px;
}
.brand-text { font-weight: 650; font-size: 15px; letter-spacing: .2px; }

.search {
  position: relative; flex: 1 1 auto; max-width: 620px; margin: 0 auto;
  display: flex; align-items: center;
}
.search input {
  width: 100%; height: 36px;
  padding: 0 62px 0 34px;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--fg); font: 14px/1 var(--sans);
  outline: none;
  transition: border-color .12s ease, box-shadow .12s ease;
}
.search input::placeholder { color: var(--fg-dim); }
.search input:focus {
  border-color: var(--accent-line);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.search::before {
  content: "⌕"; position: absolute; left: 13px;
  color: var(--fg-dim); font-size: 15px; pointer-events: none;
}
.q-clear {
  position: absolute; right: 40px;
  background: none; border: 0; color: var(--fg-dim);
  font-size: 13px; line-height: 1; padding: 6px;
}
.q-clear:hover { color: var(--fg); }
.q-kbd {
  position: absolute; right: 12px;
  font-size: 11px; color: var(--fg-dim);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 1px 6px; background: var(--bg-elev-2);
}

.topbar-right { display: flex; gap: 8px; flex: 0 0 auto; }

.icon-btn {
  height: 32px; padding: 0 11px;
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg-muted); font-size: 13px;
}
.icon-btn:hover { color: var(--fg); border-color: var(--accent-line); }

.ghost-btn {
  background: none; border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--fg-muted);
  font-size: 12px; padding: 5px 10px;
}
.ghost-btn:hover { color: var(--fg); border-color: var(--accent-line); }

.only-narrow { display: none; }

/* ---------- 4. 布局 ---------- */
.layout {
  display: grid;
  grid-template-columns: 268px minmax(0, 1fr) minmax(360px, 440px);
  height: calc(100vh - 56px);
}

.sidebar, .detail, .playground {
  overflow-y: auto;
  overscroll-behavior: contain;
}

.sidebar {
  display: flex; flex-direction: column;
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  padding: 14px 10px 0;
}
.detail { padding: 26px 34px 80px; }
.playground {
  background: var(--bg-elev);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
}

/* 滚动条 */
.sidebar::-webkit-scrollbar, .detail::-webkit-scrollbar, .playground::-webkit-scrollbar,
.pg-code::-webkit-scrollbar { width: 10px; height: 10px; }
.sidebar::-webkit-scrollbar-thumb, .detail::-webkit-scrollbar-thumb,
.playground::-webkit-scrollbar-thumb, .pg-code::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 6px;
  border: 3px solid transparent; background-clip: content-box;
}
.sidebar::-webkit-scrollbar-thumb:hover, .detail::-webkit-scrollbar-thumb:hover,
.playground::-webkit-scrollbar-thumb:hover, .pg-code::-webkit-scrollbar-thumb:hover {
  background: var(--fg-dim); background-clip: content-box;
}

/* ---------- 5. 侧边栏 ---------- */
.cats { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }

.cat {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border: 1px solid transparent; border-radius: var(--radius-sm);
  background: none; text-align: left; width: 100%;
  color: var(--fg-muted); font-size: 13.5px;
}
.cat:hover { background: var(--bg-elev-2); color: var(--fg); }
.cat.is-active {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--fg); font-weight: 600;
}
.cat-dot {
  width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
  background: var(--dot, var(--c-concept));
}
.cat-name { flex: 1 1 auto; }
.cat-n { font-size: 11.5px; color: var(--fg-dim); font-family: var(--mono); }
.cat.is-active .cat-n { color: var(--fg-muted); }

.list-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 0 10px 7px; margin-top: 4px;
  border-top: 1px solid var(--border-soft); padding-top: 12px;
}
.list-head span:first-child {
  font-size: 11.5px; font-weight: 650; letter-spacing: .7px;
  text-transform: uppercase; color: var(--fg-dim);
}

.entries { flex: 1 1 auto; padding-bottom: 10px; }

.entry-item {
  display: block; width: 100%; text-align: left;
  padding: 7px 10px; border: 0; border-radius: var(--radius-sm);
  background: none; color: var(--fg-muted);
  font-size: 13.5px; line-height: 1.45;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.entry-item:hover { background: var(--bg-elev-2); color: var(--fg); }
.entry-item.is-active {
  background: var(--bg-elev-2); color: var(--fg);
  font-weight: 600; box-shadow: inset 2px 0 0 var(--accent);
}
.entry-item .ei-mark { font-family: var(--mono); }
.entry-item .ei-zh { color: var(--fg-dim); font-weight: 400; margin-left: 7px; font-size: 12px; }
.entry-item .ei-star { color: var(--warn); margin-right: 5px; }
.entry-item.is-cursor { background: var(--accent-soft); color: var(--fg); }

.empty-note { padding: 16px 12px; color: var(--fg-dim); font-size: 13px; line-height: 1.7; }

.sidebar-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 4px 12px; border-top: 1px solid var(--border-soft);
  position: sticky; bottom: 0; background: var(--bg-elev);
}

/* ---------- 6. 详情面板 ---------- */
.entry-head { border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 20px; }

.crumbs { font-size: 12px; color: var(--fg-dim); margin-bottom: 8px; letter-spacing: .3px; }
.crumbs b { color: var(--fg-muted); font-weight: 600; }

.entry-title {
  font-size: 30px; line-height: 1.2; letter-spacing: -.4px;
  font-family: var(--mono); font-weight: 700;
  word-break: break-word;
}
.entry-title .t-zh {
  font-family: var(--sans); font-size: 15px; font-weight: 400;
  color: var(--fg-muted); margin-left: 12px; letter-spacing: 0;
}

.badges { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; align-items: center; }
.badge {
  font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--fg-muted); background: var(--bg-elev-2);
}
.badge-cat { color: var(--bc); border-color: color-mix(in srgb, var(--bc) 40%, transparent);
             background: color-mix(in srgb, var(--bc) 12%, transparent); font-weight: 600; }
.badge-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent);
              background: color-mix(in srgb, var(--warn) 12%, transparent); font-weight: 600; }
.badge-ok   { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent);
              background: color-mix(in srgb, var(--ok) 10%, transparent); }

.star-btn {
  margin-left: auto; background: none; border: 1px solid var(--border);
  border-radius: 999px; padding: 2px 12px; font-size: 12px; color: var(--fg-muted);
}
.star-btn:hover { color: var(--fg); border-color: var(--accent-line); }
.star-btn.is-on { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }

.section { margin-bottom: 24px; max-width: 74ch; }
.section-title {
  font-size: 11.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase;
  color: var(--fg-dim); margin-bottom: 9px;
}
.purpose { font-size: 16.5px; line-height: 1.75; color: var(--fg); }

.code-block { position: relative; margin: 0; }
.code-block pre {
  margin: 0; padding: 13px 15px;
  background: var(--bg-sunken); border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow-x: auto; font-size: 13.5px; line-height: 1.65;
  color: var(--fg);
  white-space: pre;
  tab-size: 2;
}
.code-block .copy {
  position: absolute; top: 7px; right: 7px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--fg-dim);
  font-size: 11.5px; padding: 3px 8px; opacity: 0;
  transition: opacity .12s ease;
}
.code-block:hover .copy, .copy:focus-visible { opacity: 1; }
.code-block .copy:hover { color: var(--fg); }

.err-list li {
  position: relative; padding-left: 24px; margin-bottom: 9px;
  font-size: 15px; line-height: 1.7; color: var(--fg-muted);
}
.err-list li::before {
  content: "✕"; position: absolute; left: 4px; top: 0;
  color: var(--danger); font-size: 13px; font-weight: 700;
}

.ok-list li {
  position: relative; padding-left: 24px; margin-bottom: 9px;
  font-size: 15px; line-height: 1.7; color: var(--fg-muted);
}
.ok-list li::before {
  content: "✓"; position: absolute; left: 4px; top: 0;
  color: var(--ok); font-size: 13px; font-weight: 700;
}

.tip {
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  padding: 11px 15px; border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 15px; line-height: 1.7; color: var(--fg);
}
.tip b { color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  background: var(--bg-elev-2); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 12px;
  font-size: 13px; color: var(--fg-muted);
}
.chip:hover { color: var(--fg); border-color: var(--accent-line); background: var(--accent-soft); }
.chip .chip-zh { color: var(--fg-dim); margin-left: 6px; font-size: 12px; }

.welcome { max-width: 66ch; }
.welcome h2 { font-size: 22px; margin-bottom: 12px; }
.welcome p { color: var(--fg-muted); font-size: 15.5px; }
.welcome .kv { display: flex; gap: 10px; margin-bottom: 8px; align-items: baseline; }
.welcome .kv b { font-family: var(--mono); color: var(--fg); font-weight: 600; min-width: 150px; }
.welcome .kv span { color: var(--fg-muted); font-size: 14.5px; }

.audit-out {
  margin-top: 16px; background: var(--bg-sunken); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
}
.audit-out h3 { font-size: 14px; margin-bottom: 8px; }
.audit-out ul li { font-size: 13.5px; color: var(--fg-muted); line-height: 1.7;
                   padding-left: 16px; position: relative; }
.audit-out ul li::before { content: "·"; position: absolute; left: 4px; color: var(--fg-dim); }
.audit-out .ok-msg { color: var(--ok); font-size: 14px; }

/* ---------- 7. 代码实验区 ---------- */
.pg-head {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.pg-title { font-size: 11.5px; font-weight: 700; letter-spacing: .9px;
            text-transform: uppercase; color: var(--fg-dim); margin-bottom: 10px; }
.pg-tabs { display: flex; gap: 4px; }
.pg-tab {
  flex: 1 1 0; padding: 6px 0; text-align: center;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--fg-dim);
  font-size: 12.5px; font-family: var(--mono);
}
.pg-tab:hover { color: var(--fg); }
.pg-tab.is-active { background: var(--accent-soft); border-color: var(--accent-line);
                    color: var(--fg); font-weight: 600; }
.pg-tab .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
               background: var(--fg-dim); margin-left: 6px; vertical-align: middle; }
.pg-tab.has-code .dot { background: var(--ok); }

.pg-body { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }

.pg-code {
  flex: 0 0 34%;
  min-height: 130px;
  position: relative;
  border-bottom: 1px solid var(--border);
}
.pg-code textarea {
  width: 100%; height: 100%; resize: none;
  background: var(--bg-sunken); color: var(--fg);
  border: 0; outline: none;
  padding: 12px 14px;
  font: 13px/1.65 var(--mono);
  tab-size: 2; white-space: pre; overflow: auto;
}
.pg-code textarea::placeholder { color: var(--fg-dim); }

.pg-actions {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.btn-run {
  background: var(--accent); color: #fff; border: 0;
  border-radius: var(--radius-sm); padding: 6px 16px;
  font-size: 13px; font-weight: 600;
}
.btn-run:hover { filter: brightness(1.08); }
.pg-hint { font-size: 11.5px; color: var(--fg-dim); margin-left: auto; font-family: var(--mono); }

.pg-preview-wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.pg-preview-head {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 14px; border-bottom: 1px solid var(--border-soft);
  font-size: 11.5px; color: var(--fg-dim); letter-spacing: .5px;
  text-transform: uppercase; font-weight: 650;
  flex: 0 0 auto;
}
.pg-preview-head .live { margin-left: auto; text-transform: none; letter-spacing: 0;
                         font-weight: 400; font-family: var(--mono); }
#pg-frame {
  flex: 1 1 auto; width: 100%; border: 0; background: #fff; min-height: 160px;
}

.pg-console {
  flex: 0 0 auto; max-height: 132px; overflow-y: auto;
  border-top: 1px solid var(--border);
  background: var(--bg-sunken);
  padding: 8px 14px;
  font: 12.5px/1.6 var(--mono);
}
.pg-console:empty::before {
  content: "控制台输出会显示在这里（console.log）";
  color: var(--fg-dim); font-family: var(--sans); font-size: 12px;
}
.console-line { white-space: pre-wrap; word-break: break-word; padding: 1px 0; }
.console-line .lv { color: var(--fg-dim); margin-right: 7px; }
.console-line.lv-log { color: var(--fg-muted); }
.console-line.lv-error { color: var(--danger); }
.console-line.lv-warn { color: var(--warn); }
.console-line.lv-return { color: var(--ok); }

/* ---------- 8. 自检 ---------- */
.audit-ok { color: var(--ok); font-size: 14px; line-height: 1.7; }

/* ---------- 9. 响应式 ---------- */
/* 中等屏：预览区移到详情下面 */
@media (max-width: 1200px) {
  .layout {
    grid-template-columns: 240px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) 420px;
    height: calc(100vh - 56px);
  }
  .sidebar  { grid-column: 1; grid-row: 1 / span 2; }
  .detail   { grid-column: 2; grid-row: 1; }
  .playground { grid-column: 2; grid-row: 2; border-left: 0;
                border-top: 1px solid var(--border); }
}

/* 窄屏：单栏 + 抽屉式目录 */
@media (max-width: 820px) {
  body { overflow: auto; }

  .layout {
    display: block;
    height: auto;
  }
  .detail { padding: 20px 18px 60px; }
  .playground { height: auto; }
  .pg-code { flex: 0 0 auto; height: 190px; }
  #pg-frame { height: 300px; flex: 0 0 auto; }

  .sidebar {
    position: fixed; top: 56px; bottom: 0; left: 0; z-index: 40;
    width: 280px; max-width: 86vw;
    transform: translateX(-102%);
    box-shadow: var(--shadow);
  }
  .sidebar.is-open { transform: none; }

  .scrim {
    position: fixed; inset: 56px 0 0 0; z-index: 35;
    background: rgba(0,0,0,.45);
  }

  .only-narrow { display: inline-block; }
  .brand-text { display: none; }
  .search { max-width: none; }
  .q-kbd { display: none; }
  .q-clear { right: 10px; }
  .topbar-right #random-btn { display: none; }

  .entry-title { font-size: 24px; }
  .entry-title .t-zh { display: block; margin: 6px 0 0; }
}

@media (max-width: 430px) {
  .topbar { gap: 8px; padding: 0 10px; }
  .search input { padding-left: 30px; font-size: 13px; }
  .detail { padding: 16px 14px 50px; }
}

/* 尊重系统的「减少动态效果」设置 —— 本来也几乎没有动画 */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

<script>
/* ==========================================================================
   data.js — 汇总词条、定义分类、提供校验
   --------------------------------------------------------------------------
   加载顺序在 js/data/*.js 之后。它把五个数据文件合并成一个总表，
   并给每条词条补上「类别」信息，供搜索和界面使用。
   ========================================================================== */

window.WDT = (function () {

  /* 五个类别。加新类别时：在这里加一项，再新建对应的 js/data/xxx.js，
     并在 index.html 里加一行 <script>。 */
  const CATS = [
    { key: 'html-tag',  label: 'HTML 标签', short: '标签', hex: '#ff9e64', arr: window.WDT_HTML_TAGS },
    { key: 'html-attr', label: 'HTML 属性', short: '属性', hex: '#e0af68', arr: window.WDT_HTML_ATTRS },
    { key: 'css-prop',  label: 'CSS 属性',  short: 'CSS',  hex: '#7dcfff', arr: window.WDT_CSS_PROPS },
    { key: 'js-method', label: 'JS 方法',   short: 'JS',   hex: '#bb9af7', arr: window.WDT_JS_METHODS },
    { key: 'concept',   label: '基础概念',  short: '概念', hex: '#9aa5ce', arr: window.WDT_CONCEPTS }
  ];

  const ALL = [];
  CATS.forEach(function (c) {
    (c.arr || []).forEach(function (e) {
      e.cat = c.key;
      e.catLabel = c.label;
      e.catHex = c.hex;
      ALL.push(e);
    });
  });

  const BY_ID = new Map();
  ALL.forEach(function (e) { BY_ID.set(e.id, e); });

  /* 搜索用的归一化：去掉尖括号、括号、空格，统一小写。
     这样搜 "<div>" 和 "div" 效果一样。 */
  function norm(s) {
    return String(s == null ? '' : s)
      .toLowerCase()
      .replace(/[<>()（）]/g, '')
      .trim();
  }

  const STATUS_ZH = {
    modern:     null,               // 推荐写法不显示徽章，减少干扰
    legacy:     '旧写法',
    deprecated: '已废弃'
  };

  function statusLabel(st) { return STATUS_ZH[st] || null; }

  /* 需要哪些字段（自检用） */
  const REQUIRED = ['id', 'name', 'zh', 'purpose', 'syntax', 'status', 'keywords', 'example', 'errors', 'related'];
  const STATUSES = ['modern', 'legacy', 'deprecated'];

  function validate() {
    const issues = [];
    const seen = new Set();

    ALL.forEach(function (e, i) {
      const where = (e && e.id) ? e.id : ('第 ' + (i + 1) + ' 条（没有 id）');

      REQUIRED.forEach(function (f) {
        const v = e[f];
        if (v === undefined || v === null || v === '') {
          issues.push(where + '：缺字段 ' + f);
        }
      });

      if (e.id) {
        if (seen.has(e.id)) issues.push(where + '：id 重复');
        seen.add(e.id);
      }

      if (e.status && STATUSES.indexOf(e.status) < 0) {
        issues.push(where + '：status 只能是 modern / legacy / deprecated，现在是 "' + e.status + '"');
      }

      if (e.example) {
        ['html', 'css', 'js'].forEach(function (k) {
          if (typeof e.example[k] !== 'string') {
            issues.push(where + '：example 缺 "' + k + '"（不用的话给空字符串）');
          }
        });
        const blank = !e.example.html && !e.example.css && !e.example.js;
        if (blank) issues.push(where + '：example 三段全是空的，实验区会是一片空白');
      }

      ['keywords', 'errors', 'related'].forEach(function (k) {
        if (e[k] && !Array.isArray(e[k])) issues.push(where + '：' + k + ' 应该是数组');
      });
    });

    // 相关概念指向的词条必须真实存在
    ALL.forEach(function (e) {
      (e.related || []).forEach(function (rid) {
        if (!BY_ID.has(rid)) {
          issues.push(e.id + '：related 里的 "' + rid + '" 不存在');
        }
        if (rid === e.id) {
          issues.push(e.id + '：related 指向了自己');
        }
      });
    });

    return issues;
  }

  function countsByCat() {
    const m = {};
    CATS.forEach(function (c) { m[c.key] = 0; });
    ALL.forEach(function (e) { m[e.cat] = (m[e.cat] || 0) + 1; });
    return m;
  }

  return {
    CATS: CATS,
    ALL: ALL,
    BY_ID: BY_ID,
    norm: norm,
    statusLabel: statusLabel,
    validate: validate,
    countsByCat: countsByCat,
    meta: {
      title: 'Web 学习工具箱',
      total: ALL.length
    }
  };
})();

</script>
<script>
/* ==========================================================================
   search.js — 搜索与排序
   --------------------------------------------------------------------------
   支持：按名称、中文别名、用途、关键词搜索；空格分隔多个关键词（要全中）。
   计分方式简单直白：匹配得越"靠前、越完整"，分越高。
   ========================================================================== */

window.WDT.search = (function () {

  const norm = window.WDT.norm;

  /* 单条词条 vs 单个关键词的最高得分；0 表示不匹配 */
  function scoreOne(entry, t) {
    const name = norm(entry.name);
    const zh = String(entry.zh || '').toLowerCase();
    const purpose = String(entry.purpose || '').toLowerCase();
    const kws = (entry.keywords || []).map(function (k) { return String(k).toLowerCase(); });

    /* 单个 ASCII 字母（比如 a、p）走严格模式：只认完全相等或名字开头。
       否则搜 "a" 会因为 "background-color" 里含 a 而返回一大片，没法用。
       单个汉字不受此限 —— "居" 这种半截词是常见输入。 */
    const singleAscii = t.length === 1 && t.charCodeAt(0) < 128;

    let best = 0;

    if (name === t) best = Math.max(best, 120);
    else if (name.indexOf(t) === 0) best = Math.max(best, 90);
    else if (!singleAscii && name.indexOf(t) >= 0) best = Math.max(best, 70);

    if (zh === t) best = Math.max(best, 100);
    else if (!singleAscii && zh.indexOf(t) >= 0) best = Math.max(best, 60);

    kws.forEach(function (k) {
      if (k === t) best = Math.max(best, 80);
      else if (!singleAscii && k.indexOf(t) >= 0) best = Math.max(best, 45);
    });

    if (singleAscii) return best;

    const catLabel = String(entry.catLabel || '').toLowerCase();
    if (catLabel.indexOf(t) >= 0) best = Math.max(best, 20);

    if (purpose.indexOf(t) >= 0) best = Math.max(best, 30);

    const tip = String(entry.tip || '').toLowerCase();
    if (tip.indexOf(t) >= 0) best = Math.max(best, 12);

    const errs = (entry.errors || []).join(' ').toLowerCase();
    if (errs.indexOf(t) >= 0) best = Math.max(best, 10);

    return best;
  }

  /**
   * 搜索入口。
   * @param {string} query 原始查询串
   * @param {{or?: boolean}} [opts] or=true 时只要命中任一个关键词就算（用于兜底）
   * @returns {Array<{entry, score, hit}>} 按分数从高到低
   */
  function run(query, opts) {
    const or = !!(opts && opts.or);
    const q = String(query || '').trim();
    if (!q) return [];

    const tokens = q.split(/\s+/).map(norm).filter(Boolean);
    if (!tokens.length) return [];

    const out = [];
    window.WDT.ALL.forEach(function (entry) {
      let total = 0;
      let hits = 0;
      let firstHit = 0;

      for (let i = 0; i < tokens.length; i++) {
        const s = scoreOne(entry, tokens[i]);
        if (!s) continue;
        hits++;
        total += s;
        if (!firstHit) firstHit = s;
      }

      if (or ? hits === 0 : hits !== tokens.length) return;

      // 命中越多关键词排越前；名称命中再加权
      const boost = or ? hits * 60 : (tokens.length - 1) * 15;
      out.push({ entry: entry, score: total + firstHit * 0.5 + boost, hit: firstHit, hits: hits });
    });

    out.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.entry.name.localeCompare(b.entry.name);
    });

    return out;
  }

  /* 生成一小段"为什么这条会被搜到"的摘要 */
  function snippet(entry, query) {
    const text = String(entry.purpose || '');
    const tokens = String(query || '').split(/\s+/).map(norm).filter(Boolean);
    const lower = text.toLowerCase();
    let idx = -1;
    tokens.forEach(function (t) {
      if (idx >= 0) return;
      idx = lower.indexOf(t);
    });
    if (idx < 0) return text.length > 60 ? text.slice(0, 60) + '…' : text;
    const start = Math.max(0, idx - 12);
    const end = Math.min(text.length, idx + 48);
    return (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
  }

  return { run: run, snippet: snippet };
})();

</script>
<script>
/* ==========================================================================

   --------------------------------------------------------------------------
   三块可编辑代码（HTML / CSS / JS）拼成一份完整文档，
   塞进 sandbox iframe 的 srcdoc 里运行 —— 与主页面完全隔离。
   子页面里的 console.log 会通过 postMessage 回传到这里显示。
   ========================================================================== */

window.WDT.playground = (function () {

  /* 预览网页的基础样式：让示例看起来干净一点。
     用户自己的 CSS 写在它后面，所以可以覆盖它。 */
  const BASE_CSS = [
    '*{box-sizing:border-box}',
    'body{margin:0;padding:14px;background:#fff;color:#1c2129;' +
      'font:15px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}',
    'p{margin:0 0 10px}',
    'img{max-width:100%}',
    'button,input,select,textarea{font:inherit}'
  ].join('\n');

  /* 注入到预览页里的小工具：转发 console 输出 + 捕获未处理错误 */
  const BRIDGE = [
    '(function(){',
    '  function fmt(v){',
    '    if (typeof v === "string") return v;',
    '    if (v === null) return "null";',
    '    if (v === undefined) return "undefined";',
    '    if (typeof v === "function") return "[函数]";',
    '    if (v instanceof Error) return v.message;',
    '    if (v && v.nodeType === 1) return "<" + String(v.tagName).toLowerCase() + ">";',
    '    try { var s = JSON.stringify(v); return s === undefined ? String(v) : s; }',
    '    catch (e) { return String(v); }',
    '  }',
    '  function send(level, args){',
    '    try {',
    '      var parts = [];',
    '      for (var i = 0; i < args.length; i++) parts.push(fmt(args[i]));',
    '      parent.postMessage({ __wdt: 1, level: level, text: parts.join(" ") }, "*");',
    '    } catch (e) {}',
    '  }',
    '  ["log","info","warn","error"].forEach(function(k){',
    '    var old = console[k];',
    '    console[k] = function(){',
    '      send(k === "info" ? "log" : k, arguments);',
    '      try { old.apply(console, arguments); } catch (e) {}',
    '    };',
    '  });',
    '  window.addEventListener("error", function(e){',
    '    send("error", ["未捕获错误：" + e.message + (e.lineno ? "（第 " + e.lineno + " 行）" : "")]);',
    '  });',
    '})();'
  ].join('\n');

  const TABS = [
    { k: 'html', label: 'HTML' },
    { k: 'css',  label: 'CSS' },
    { k: 'js',   label: 'JS' }
  ];
  const MAX_LOGS = 80;

  let mount = null;
  let tabsEl = null;
  let editorEl = null;
  let frameEl = null;
  let consoleEl = null;
  let titleEl = null;

  let cur = 'html';
  const code = { html: '', css: '', js: '' };
  let loaded = null;          // 当前加载的词条
  let timer = null;

  /* ---------- 组装文档 ---------- */
  function escapeScript(js) {
    // 避免用户代码里的 <\/script> 提前结束脚本块
    return String(js || '').replace(/<\/script/gi, '<\\/script');
  }

  function buildDoc() {
    return '<!DOCTYPE html>\n' +
      '<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n<style>\n' +
      BASE_CSS + '\n' + code.css + '\n</style>\n</head>\n<body>\n' +
      code.html +
      '\n<script>\n' + BRIDGE + '\n<\/script>\n' +
      '<script>\n' + escapeScript(code.js) + '\n<\/script>\n' +
      '</body>\n</html>';
  }

  /* ---------- 控制台 ---------- */
  function pushLog(level, text) {
    if (!consoleEl) return;
    const line = document.createElement('div');
    line.className = 'console-line lv-' + (level || 'log');
    const tag = document.createElement('span');
    tag.className = 'lv';
    tag.textContent = level === 'error' ? '✕' : (level === 'warn' ? '!' : '›');
    line.appendChild(tag);
    line.appendChild(document.createTextNode(text));
    consoleEl.appendChild(line);
    while (consoleEl.childNodes.length > MAX_LOGS) consoleEl.removeChild(consoleEl.firstChild);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  function clearLogs() { if (consoleEl) consoleEl.textContent = ''; }

  /* ---------- 运行 ---------- */
  function stash() {
    if (editorEl) code[cur] = editorEl.value;
  }

  function run() {
    stash();
    if (!frameEl) return;
    clearLogs();
    frameEl.srcdoc = buildDoc();
  }

  function scheduleRun() {
    clearTimeout(timer);
    timer = setTimeout(run, 500);
  }

  /* ---------- 标签页 ---------- */
  function paintTabs() {
    if (!tabsEl) return;
    tabsEl.querySelectorAll('.pg-tab').forEach(function (b) {
      const k = b.dataset.k;
      b.classList.toggle('is-active', k === cur);
      b.classList.toggle('has-code', String(code[k] || '').trim().length > 0);
    });
    if (editorEl) {
      editorEl.value = code[cur] || '';
      editorEl.placeholder = cur === 'html' ? '<!-- 在这里写 HTML -->'
        : cur === 'css' ? '/* 在这里写 CSS */'
        : '// 在这里写 JavaScript';
    }
  }

  function switchTo(k) {
    if (k === cur) return;
    stash();
    cur = k;
    paintTabs();
  }

  /* ---------- 挂载 ---------- */
  function mountUI() {
    mount.innerHTML = '';

    const head = document.createElement('div');
    head.className = 'pg-head';
    head.innerHTML =
      '<div class="pg-title">代码实验区</div>' +
      '<div class="pg-tabs"></div>';
    mount.appendChild(head);
    tabsEl = head.querySelector('.pg-tabs');

    TABS.forEach(function (t) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pg-tab';
      b.dataset.k = t.k;
      b.innerHTML = t.label + '<span class="dot"></span>';
      b.addEventListener('click', function () { switchTo(t.k); });
      tabsEl.appendChild(b);
    });

    const body = document.createElement('div');
    body.className = 'pg-body';
    mount.appendChild(body);

    const codeWrap = document.createElement('div');
    codeWrap.className = 'pg-code';
    editorEl = document.createElement('textarea');
    editorEl.spellcheck = false;
    editorEl.setAttribute('wrap', 'off');
    editorEl.setAttribute('aria-label', '代码编辑区');
    editorEl.addEventListener('input', function () { code[cur] = editorEl.value; paintTabs(); scheduleRun(); });
    editorEl.addEventListener('keydown', function (e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = editorEl.selectionStart, en = editorEl.selectionEnd;
        editorEl.value = editorEl.value.slice(0, s) + '  ' + editorEl.value.slice(en);
        editorEl.selectionStart = editorEl.selectionEnd = s + 2;
        code[cur] = editorEl.value;
        paintTabs();
        scheduleRun();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
    });
    codeWrap.appendChild(editorEl);
    body.appendChild(codeWrap);

    const actions = document.createElement('div');
    actions.className = 'pg-actions';
    actions.innerHTML =
      '<button type="button" class="btn-run">运行</button>' +
      '<button type="button" class="ghost-btn" id="pg-reset">重置</button>' +
      '<span class="pg-hint">Ctrl+Enter 运行</span>';
    body.appendChild(actions);
    actions.querySelector('.btn-run').addEventListener('click', run);
    actions.querySelector('#pg-reset').addEventListener('click', function () {
      if (loaded) load(loaded); else run();
    });

    const pv = document.createElement('div');
    pv.className = 'pg-preview-wrap';
    pv.innerHTML =
      '<div class="pg-preview-head">预览<span class="live" id="pg-live"></span></div>' +
      '<iframe id="pg-frame" sandbox="allow-scripts allow-modals" title="预览"></iframe>';
    body.appendChild(pv);
    frameEl = pv.querySelector('#pg-frame');
    titleEl = pv.querySelector('#pg-live');

    consoleEl = document.createElement('div');
    consoleEl.className = 'pg-console';
    consoleEl.setAttribute('aria-live', 'polite');
    mount.appendChild(consoleEl);
  }

  /* ---------- 对外接口 ---------- */
  function load(entry) {
    loaded = entry || null;
    const ex = (entry && entry.example) || { html: '', css: '', js: '' };
    code.html = ex.html || '';
    code.css = ex.css || '';
    code.js = ex.js || '';
    cur = 'html';
    paintTabs();
    if (titleEl) {
      titleEl.textContent = entry ? ('正在实验：' + entry.name) : '还没有载入示例';
    }
    run();
  }

  function init(selector) {
    mount = document.querySelector(selector);
    if (!mount) return;
    mountUI();
    paintTabs();
    load(null);

    // 子页面回传的 console 与错误
    window.addEventListener('message', function (ev) {
      const d = ev.data;
      if (!d || d.__wdt !== 1) return;
      pushLog(d.level, d.text);
    });
  }

  return { init: init, load: load, run: run, getLoaded: function () { return loaded; } };
})();

</script>
<script>
/* ==========================================================================
   app.js — 界面渲染、路由、搜索交互、主题、收藏、自检
   ========================================================================== */

(function () {

  const D = window.WDT;
  const $ = function (s, root) { return (root || document).querySelector(s); };

  /* ---------- 安全存储（file:// 下某些浏览器会禁用 localStorage） ---------- */
  const LS = {
    get: function (k, fallback) {
      try {
        const v = localStorage.getItem(k);
        return v === null ? fallback : JSON.parse(v);
      } catch (e) { return fallback; }
    },
    set: function (k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
    }
  };

  const K_FAV = 'wdt.fav', K_RECENT = 'wdt.recent', K_THEME = 'wdt.theme';
  const MAX_RECENT = 12;

  /* ---------- 状态 ---------- */
  const state = {
    cat: 'all',
    q: '',
    results: null,     // 搜索命中结果（{entry,score}）
    sel: null,         // 当前打开的词条 id
    cursor: 0,         // 搜索结果键盘高亮位置
    view: 'entry'      // entry | welcome | audit
  };

  let favSet = new Set(LS.get(K_FAV, []));
  let recent = LS.get(K_RECENT, []);

  /* ---------- 小工具 ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function copyText(text, btn) {
    const done = function () {
      const old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = old; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(); });
    } else { fallback(); }

    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  function codeBlock(text, label) {
    if (!text || !String(text).trim()) return '';
    return '<div class="section">' +
      (label ? '<h2 class="section-title">' + esc(label) + '</h2>' : '') +
      '<div class="code-block"><pre>' + esc(text) + '</pre>' +
      '<button type="button" class="copy" data-copy>复制</button></div></div>';
  }

  /* ---------- 分类导航 ---------- */
  function catItems() {
    const counts = D.countsByCat();
    const items = [{ key: 'all', label: '全部词条', hex: 'var(--fg-dim)', n: D.ALL.length }];
    D.CATS.forEach(function (c) {
      items.push({ key: c.key, label: c.label, hex: c.hex, n: counts[c.key] || 0 });
    });
    items.push({ key: 'fav', label: '我的收藏', hex: 'var(--warn)', n: favSet.size });
    items.push({ key: 'recent', label: '最近查看', hex: 'var(--ok)', n: recent.length });
    return items;
  }

  function renderCats() {
    const box = $('#cats');
    box.innerHTML = '';
    catItems().forEach(function (c) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cat' + (state.cat === c.key && !state.q ? ' is-active' : '');
      b.dataset.cat = c.key;
      b.innerHTML = '<span class="cat-dot" style="--dot:' + c.hex + '"></span>' +
        '<span class="cat-name">' + esc(c.label) + '</span>' +
        '<span class="cat-n">' + c.n + '</span>';
      b.addEventListener('click', function () {
        state.cat = c.key;
        state.q = '';
        state.results = null;
        $('#q').value = '';
        $('#q-clear').hidden = true;
        state.cursor = 0;
        renderCats();
        renderList();
        closeDrawer();
      });
      box.appendChild(b);
    });
  }

  /* ---------- 当前该显示哪些词条 ---------- */
  function visibleEntries() {
    if (state.q) return (state.results || []).map(function (r) { return r.entry; });
    if (state.cat === 'fav') {
      return Array.from(favSet).map(function (id) { return D.BY_ID.get(id); }).filter(Boolean);
    }
    if (state.cat === 'recent') {
      return recent.map(function (id) { return D.BY_ID.get(id); }).filter(Boolean);
    }
    if (state.cat === 'all') return D.ALL;
    return D.ALL.filter(function (e) { return e.cat === state.cat; });
  }

  function renderList() {
    const list = $('#entries');
    const items = visibleEntries();
    const titleBox = $('#list-title');
    const countBox = $('#list-count');

    if (state.q) titleBox.textContent = state.fallback ? '宽松匹配' : '搜索结果';
    else {
      const c = catItems().filter(function (x) { return x.key === state.cat; })[0];
      titleBox.textContent = c ? c.label : '词条';
    }
    countBox.textContent = items.length + ' 条';

    list.innerHTML = '';

    if (!items.length) {
      const li = document.createElement('li');
      li.className = 'empty-note';
      if (state.q) {
        li.textContent = '没找到「' + state.q + '」。试试更短的关键词，比如只输 div、颜色、居中。';
      } else if (state.cat === 'fav') {
        li.textContent = '还没有收藏。打开任意词条，点标题右边的「收藏」就会出现在这里。';
      } else if (state.cat === 'recent') {
        li.textContent = '还没有浏览记录。看过的词条会自动记在这里。';
      } else {
        li.textContent = '这个分类下暂时没有词条。';
      }
      list.appendChild(li);
      return;
    }

    items.forEach(function (e, i) {
      const li = document.createElement('li');
      if (state.q && state.fallback && i === 0) {
        const note = document.createElement('div');
        note.className = 'empty-note';
        note.textContent = '没有同时包含这几个词的词条，下面是包含其中任意一个的：';
        li.appendChild(note);
      }
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'entry-item' +
        (e.id === state.sel ? ' is-active' : '') +
        (state.q && i === state.cursor ? ' is-cursor' : '');
      b.dataset.id = e.id;
      const isFav = favSet.has(e.id);
      b.innerHTML = (isFav ? '<span class="ei-star">★</span>' : '') +
        '<span class="ei-mark">' + esc(e.name) + '</span>' +
        '<span class="ei-zh">' + esc(e.zh) + '</span>';
      b.title = e.catLabel + ' · ' + e.name + (e.zh ? '（' + e.zh + '）' : '');
      b.addEventListener('click', function () { select(e.id); });
      li.appendChild(b);
      list.appendChild(li);
    });
  }

  /* ---------- 详情 ---------- */
  function renderWelcome() {
    state.view = 'welcome';
    $('#detail').innerHTML =
      '<div class="welcome">' +
      '<h2>边查边改，看它真的会发生什么</h2>' +
      '<p>左边挑一个词条，中间读讲解，右边那块代码可以直接改 —— 改完立刻能看到效果，' +
      '不用新建文件、不用配环境。</p>' +
      '<p>当前收录 <b>' + D.ALL.length + '</b> 条：' +
      D.CATS.map(function (c) { return c.label + ' ' + (D.countsByCat()[c.key] || 0); }).join(' · ') +
      '</p>' +
      '<div class="audit-out">' +
      '<h3>三件值得先做的事</h3><ul>' +
      '<li>按 <b>/</b> 跳到搜索框，输入 <b>居中</b>、<b>显示</b>、<b>数组</b> 试试</li>' +
      '<li>先看「基础概念」里的 <b>HTML 属性 vs CSS 属性</b> —— 那是初学者最容易混的地方</li>' +
      '<li>在右边改一行代码，按 <b>Ctrl+Enter</b> 重新运行，看看哪里变了</li>' +
      '</ul></div>' +
      '<div class="audit-out">' +
      '<h3>怎么知道一条写法是不是过时了</h3>' +
      '<p class="muted" style="margin:0">带橙色徽章的就是：' +
      '「已废弃」表示标准不再推荐，「旧写法」表示能用但新代码不该这么写。' +
      '每条都会写清楚现在该用什么代替。</p>' +
      '</div>' +
      '</div>';
    renderPlaygroundHint();
  }

  function renderPlaygroundHint() {
    window.WDT.playground.load(null);
  }

  function select(id, opts) {
    const e = D.BY_ID.get(id);
    if (!e) return;
    state.sel = id;
    state.view = 'entry';

    // 记进最近查看
    recent = [id].concat(recent.filter(function (x) { return x !== id; })).slice(0, MAX_RECENT);
    LS.set(K_RECENT, recent);

    // 地址栏同步，方便收藏和分享
    if (!opts || !opts.silent) {
      try { history.replaceState(null, '', '#' + id); } catch (err) { location.hash = id; }
    }

    paintDetail(e);
    renderCats();
    renderList();
    window.WDT.playground.load(e);
    $('#detail').scrollTop = 0;
    closeDrawer();
  }

  function paintDetail(e) {
    const items = visibleEntries();
    const idx = items.map(function (x) { return x.id; }).indexOf(e.id);
    const st = D.statusLabel(e.status);
    const isFav = favSet.has(e.id);

    let h = '';
    h += '<div class="entry-head">';
    h += '<div class="crumbs"><b>' + esc(e.catLabel) + '</b>' +
         (idx >= 0 ? ' · 第 ' + (idx + 1) + ' / ' + items.length + ' 条' : '') + '</div>';
    h += '<h1 class="entry-title"' + (e.cat === 'concept' ? ' style="font-family:var(--sans)"' : '') + '>' +
         esc(e.name) + (e.zh ? '<span class="t-zh">' + esc(e.zh) + '</span>' : '') + '</h1>';
    h += '<div class="badges">';
    h += '<span class="badge badge-cat" style="--bc:' + e.catHex + '">' + esc(e.catLabel) + '</span>';
    if (st) h += '<span class="badge badge-warn">' + esc(st) + '</span>';
    else h += '<span class="badge badge-ok">推荐写法</span>';
    h += '<button type="button" class="star-btn' + (isFav ? ' is-on' : '') + '" id="star">' +
         (isFav ? '★ 已收藏' : '☆ 收藏') + '</button>';
    h += '</div></div>';

    h += '<div class="section"><h2 class="section-title">用途</h2>' +
         '<p class="purpose">' + esc(e.purpose) + '</p></div>';

    h += codeBlock(e.syntax, '语法');

    // 示例：三段分开列
    const ex = e.example || {};
    const hasEx = String(ex.html || '').trim() || String(ex.css || '').trim() || String(ex.js || '').trim();
    if (hasEx) {
      h += '<div class="section"><h2 class="section-title">示例' +
           '<span style="font-weight:400;text-transform:none;letter-spacing:0">（右边实验区里可以直接改）</span>' +
           '</h2>';
      if (String(ex.html || '').trim()) h += codeBlock(ex.html, null);
      if (String(ex.css || '').trim()) h += codeBlock(ex.css, null);
      if (String(ex.js || '').trim()) h += codeBlock(ex.js, null);
      h += '</div>';
    }

    if ((e.errors || []).length) {
      h += '<div class="section"><h2 class="section-title">常见错误</h2><ul class="err-list">';
      e.errors.forEach(function (x) { h += '<li>' + esc(x) + '</li>'; });
      h += '</ul></div>';
    }

    if (e.tip) {
      h += '<div class="section"><h2 class="section-title">新手提示</h2>' +
           '<div class="tip">' + e.tip + '</div></div>';
    }

    const rel = (e.related || []).map(function (id) { return D.BY_ID.get(id); }).filter(Boolean);
    if (rel.length) {
      h += '<div class="section"><h2 class="section-title">相关概念</h2><div class="chips">';
      rel.forEach(function (r) {
        h += '<button type="button" class="chip" data-goto="' + esc(r.id) + '">' +
             esc(r.name) + '<span class="chip-zh">' + esc(r.zh) + '</span></button>';
      });
      h += '</div></div>';
    }

    const det = $('#detail');
    det.innerHTML = h;

    det.querySelectorAll('[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const pre = btn.parentNode.querySelector('pre');
        copyText(pre ? pre.textContent : '', btn);
      });
    });
    det.querySelectorAll('[data-goto]').forEach(function (btn) {
      btn.addEventListener('click', function () { select(btn.dataset.goto); });
    });
    const star = det.querySelector('#star');
    if (star) star.addEventListener('click', function () {
      if (favSet.has(e.id)) favSet.delete(e.id); else favSet.add(e.id);
      LS.set(K_FAV, Array.from(favSet));
      paintDetail(e);
      renderCats();
      renderList();
    });
  }

  /* ---------- 词条自检 ---------- */
  function showAudit() {
    state.view = 'audit';
    const issues = D.validate();
    let h = '<div class="entry-head"><div class="crumbs"><b>词条自检</b></div>' +
            '<h1 class="entry-title" style="font-family:var(--sans);font-size:24px">词条库检查结果</h1></div>';

    h += '<div class="section"><p class="purpose">共检查 <b>' + D.ALL.length + '</b> 条词条：' +
         '字段是否齐全、id 有没有重复、status 取值对不对、' +
         'example 三段是否都在、related 是否指向真实存在的词条。</p></div>';

    if (!issues.length) {
      h += '<div class="audit-out"><div class="audit-ok">✓ 全部通过，没有发现问题。</div>' +
           '<p class="muted" style="margin:8px 0 0">你新加的词条也可以通过这里确认一下再提交。</p></div>';
    } else {
      h += '<div class="audit-out"><h3>发现 ' + issues.length + ' 个问题</h3><ul>';
      issues.forEach(function (x) { h += '<li>' + esc(x) + '</li>'; });
      h += '</ul></div>';
    }

    h += '<div class="section"><h2 class="section-title">各分类条数</h2><ul class="ok-list">';
    D.CATS.forEach(function (c) {
      h += '<li>' + esc(c.label) + '：' + (D.countsByCat()[c.key] || 0) + ' 条</li>';
    });
    h += '</ul></div>';

    h += '<div class="section"><button type="button" class="ghost-btn" id="back-entry">回到刚才的词条</button></div>';

    const det = $('#detail');
    det.innerHTML = h;
    det.scrollTop = 0;
    const back = det.querySelector('#back-entry');
    if (back) back.addEventListener('click', function () {
      if (state.sel) select(state.sel, { silent: true }); else renderWelcome();
    });
  }

  /* ---------- 搜索 ---------- */
  function doSearch(q) {
    state.q = String(q || '').trim();
    state.fallback = false;

    if (!state.q) {
      state.results = null;
    } else {
      state.results = window.WDT.search.run(state.q);
      // 多个关键词一个都没同时命中时，退一步：只要命中任意一个就列出来，并说明原因
      if (!state.results.length && state.q.split(/\s+/).length > 1) {
        const loose = window.WDT.search.run(state.q, { or: true });
        if (loose.length) { state.results = loose; state.fallback = true; }
      }
    }

    state.cursor = 0;
    renderCats();
    renderList();
  }

  function moveCursor(d) {
    const n = visibleEntries().length;
    if (!n) return;
    state.cursor = (state.cursor + d + n) % n;
    renderList();
    const cur = $('#entries .is-cursor');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }

  /* ---------- 主题 ---------- */
  function readParam(k) {
    try { return new URLSearchParams(location.search).get(k) || ''; } catch (e) { return ''; }
  }

  function applyTheme(t, skipSave) {
    document.documentElement.setAttribute('data-theme', t);
    if (!skipSave) LS.set(K_THEME, t);
    const b = $('#theme-btn');
    if (b) b.textContent = t === 'dark' ? '浅色' : '深色';
  }

  /* ---------- 手机端抽屉 ---------- */
  function openDrawer() { $('#sidebar').classList.add('is-open'); $('#scrim').hidden = false; }
  function closeDrawer() {
    $('#sidebar').classList.remove('is-open');
    $('#scrim').hidden = true;
  }

  /* ---------- 初始化 ---------- */
  function init() {
    // 地址栏上强制指定主题（?theme=light）时不写入本地设置，免得分享链接改掉了别人的偏好
    const forcedTheme = readParam('theme');
    if (forcedTheme === 'light' || forcedTheme === 'dark') applyTheme(forcedTheme, true);
    else applyTheme(LS.get(K_THEME, 'dark'));

    $('#stats').textContent = '共 ' + D.ALL.length + ' 条';

    window.WDT.playground.init('#playground');

    // 搜索框
    const q = $('#q');
    q.addEventListener('input', function () {
      $('#q-clear').hidden = !q.value;
      doSearch(q.value);
    });
    q.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveCursor(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveCursor(-1); }
      else if (e.key === 'Enter') {
        const items = visibleEntries();
        if (items.length) select(items[Math.min(state.cursor, items.length - 1)].id);
      } else if (e.key === 'Escape') { q.value = ''; $('#q-clear').hidden = true; doSearch(''); q.blur(); }
    });
    $('#q-clear').addEventListener('click', function () {
      q.value = ''; $('#q-clear').hidden = true; doSearch(''); q.focus();
    });

    // 顶栏按钮
    $('#theme-btn').addEventListener('click', function () {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
    $('#random-btn').addEventListener('click', function () {
      select(D.ALL[Math.floor(Math.random() * D.ALL.length)].id);
    });
    $('#audit-btn').addEventListener('click', showAudit);
    $('#menu-btn').addEventListener('click', function () {
      if ($('#sidebar').classList.contains('is-open')) closeDrawer(); else openDrawer();
    });
    $('#scrim').addEventListener('click', closeDrawer);

    // 全局快捷键
    document.addEventListener('keydown', function (e) {
      const tag = (e.target.tagName || '').toLowerCase();
      const typing = tag === 'input' || tag === 'textarea';
      if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); }
      else if (e.key === 'Escape' && !typing) { closeDrawer(); }
      else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !typing && state.q) {
        e.preventDefault(); moveCursor(e.key === 'ArrowDown' ? 1 : -1);
      }
    });

    // 地址栏 hash → 打开对应词条
    function fromHash() {
      const id = String(location.hash || '').replace(/^#/, '');
      if (id && D.BY_ID.has(id)) select(id, { silent: true });
    }
    window.addEventListener('hashchange', fromHash);

    // ?q=居中 这种链接可以直接分享出去，打开就带着搜索结果
    const preset = readParam('q');
    if (preset) {
      q.value = preset;
      $('#q-clear').hidden = false;
      doSearch(preset);
    }

    renderCats();
    renderList();

    const id = String(location.hash || '').replace(/^#/, '');
    if (id && D.BY_ID.has(id)) select(id, { silent: true });
    else renderWelcome();

    // 自检模式：index.html#__audit 直接打开检查面板（方便加词条后验证）
    if (id === '__audit') showAudit();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  // 暴露给调试和自动化使用
  window.WDT.app = { select: select, audit: showAudit, state: state, search: function (q) { return window.WDT.search.run(q); } };
})();

</script>
</body>
</html>
